# JUnit Platform — parallel execution (JUnit 5 User Guide § Parallel Execution)
#
# Classes run concurrently; methods within a class stay on one thread unless overridden.
# Override per class/method with @Execution(Concurrent) / @Execution(SameThread).

junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.mode.methods.default=same_thread
